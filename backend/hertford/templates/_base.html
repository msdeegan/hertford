<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <title>{% block title %}Hertford{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* prevent rubber-banding on iOS so the page feels app-like */
    html, body { overscroll-behavior: none; }
    /* visually hide but keep accessible for screen readers */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased">
  <div class="max-w-md mx-auto px-4 py-6 pb-24">
    {% block body %}{% endblock %}
  </div>
</body>
</html>

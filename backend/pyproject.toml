[project]
name = "hertford"
version = "0.1.0"
description = "Home media control system for the house — Blustream HDMI matrix + Tapo plugs."
requires-python = ">=3.12"
dependencies = [
    "plugp100>=5.1.3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.9",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
    "segno>=1.6",
    "androidtvremote2>=0.3",
    "pyatv>=0.16",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hertford"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
